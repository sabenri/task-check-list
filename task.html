<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task List</title>

    <link rel="stylesheet" href="task.css">
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div>
                <p class="eyebrow">TASK MANAGER</p>
                <h1>My Lists</h1>
            </div>

        </header>


        <section id="list-view" class="view">

            <div id="list-container" class="list-grid">


            </div>

            <p id="empty-list">
                You have no lists yet
            </p>

            <button id="open-new-list" class="add-new-list">
                + Add New List
            </button>

        </section>

        <section id="tasks-view" class="view-hidden">

            <button id="back-to-lists" class="bck-button">
                ← My Lists
            </button>

            <h2 id="current-list">
                My List
            </h2>


            <div class="task-input-section">

                <p>
                    What needs to get done?
                </p>

                <div class="task-input">

                    <input
                        type="text"
                        id="task-input"
                        placeholder="...add new task..."
                    >

                    <button id="add-task">
                        +
                    </button>

                </div>

            </div>


            <section class="task-section">

                <h3>TO DO</h3>

                <ul id="task-list">

                </ul>

            </section>


            <section class="task-section">

                <h3>DONE</h3>

                <ul id="completed-task">

                </ul>

            </section>

        </section>

    </main>

    <script src="task.js"></script>

</body>
</html>
