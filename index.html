<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task List</title>

    <link rel="stylesheet" href="task.css">
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div>
                <p class="eyebrow">TASK MANAGER</p>
                <h1>My Lists</h1>
            </div>

        </header>


        <section id="list-view" class="view">

            <div id="list-container" class="list-grid">


            </div>

            <p id="empty-list">
                You have no lists yet
            </p>

            <button id="open-new-list" class="add-new-list">
                + Add New List
            </button>

        </section>

        <section id="tasks-view" class="view-hidden">

            <button id="back-to-lists" class="bck-button">
                ← My Lists
            </button>

            <h2 id="current-list">
                My List
            </h2>


            <div class="task-input-section">

                <p>
                    What needs to get done?
                </p>

                <div class="task-input">

                    <input
                        type="text"
                        id="task-input"
                        placeholder="...add new task..."
                    >

                    <button id="add-task">
                        +
                    </button>

                </div>

            </div>

            
            <section class="task-section">

                <h3>TO DO</h3>

                <ul id="task-list">

                </ul>

            </section>

            <section class="task-section">

                <h3>DONE</h3>

                <ul id="completed-task">

                </ul>

            </section>

        </section>


            <section id="new-list-view" class="view-hidden">
                <button id="cancel-new-list" class="back-button">
                    back to my lists
                </button>

                <h2>Create New List</h2>

                <form id="new-list-form">
                    <label for="list-name">
                        List name
                    </label>
                    <input
                     type="text"
                     id="list-name"
                     placeholder="Name your list"
                     required
                    >

                    <label for="list-deadline">
                        Deadline <span>(optional)</span>
                    </label>
                    <input 
                    type="date"
                    id="list-deadline"
                    >

                    <label for="list-color">
                        List color <span>(optional)</span>
                    </label>

                    <div class="color-options">
                        <label>
                            <input type="radio" name="list-color" value="#ff8ea1">
                            <span class="color-dot" style="background: #ff8ea1;"></span>
                        </label>
                          <label>
                            <input type="radio" name="list-color" value="#f5a560">
                            <span class="color-dot" style="background: #f5a560;"></span>
                        </label>
                          <label>
                            <input type="radio" name="list-color" value="#9880ee">
                            <span class="color-dot" style="background: #f4e272;"></span>
                        </label>
                        <label>
                            <input type="radio" name="list-color" value="#8bf179">
                            <span class="color-dot" style="background: #8bf179;"></span>
                        </label>
                        <label>
                            <input type="radio" name="list-color" value="#8ac1f0">
                            <span class="color-dot" style="background: #8ac1f0;"></span>
                        </label>
                        <label>
                            <input type="radio" name="list-color" value="#9880ee">
                            <span class="color-dot" style="background: #9880ee;"></span>
                        </label>



                    </div>



                                        <label for="new-list-task">
                        Tasks <span>(optional)</span>
                    </label>

                    <div class="new-list-task-input">
                        <input 
                        type="text"
                        id="new-list-task"
                        placeholder="...ADD TASK"
                        >

                        <button
                        type="button"
                        id="add-new-list-task"
                        >
                        +
                    </button>

                    </div>
                    <ul id="new-list-task-container">

                    </ul>

                    <button type="submit" class="Create-list-button">
                        Create List
                    </button>
                </form>

            </section>


    </main>

    <script src="task.js"></script>

</body>
</html>
